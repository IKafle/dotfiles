# bootstrap.conf — install-time configuration read by tools/bootstrap.sh
#
# KEY=VALUE, one per line. Precedence: command flag > BX_<KEY> env var > this file.
# OS-dependent package names do NOT live here — see packages/README.

# Companion app cloned to ~/todo (the MOTD today column reads it).
TODO_REPO=git@github.com:IKafle/todo.git

# Global git identity bootstrap enforces on every machine.
GIT_NAME=ishwor kafle
GIT_EMAIL=hello.ishworkafle@gmail.com

# Argos GNOME extension. extensions.gnome.org still serves the 2019 build
# (GNOME 3.32 only); upstream master declares 45+. Must contain
# <UUID>/metadata.json whose shell-version lists the running GNOME major.
ARGOS_UUID=argos@pew.worldwidemann.com
ARGOS_TARBALL=https://codeload.github.com/p-e-w/argos/tar.gz/master
ARGOS_TARBALL_SUBDIR=argos-master

# Nerd Font build of JetBrains Mono — geekbar's icons need the Nerd glyphs; the
# plain fonts-jetbrains-mono apt package does not have them. Installed per-user
# into ~/.local/share/fonts, no sudo.
NERD_FONT_URL=https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz
NERD_FONT_FAMILY=JetBrainsMono Nerd Font

# Claude Code native installer (user-local, no sudo).
CLAUDE_INSTALLER=https://claude.ai/install.sh

# Claude Code plugins to install from the official marketplace (space-separated).
# Check what's there: `claude plugins list`. Skills from a plugin show up as /<skill>.
CLAUDE_PLUGINS=mattpocock-skills

# Clean image bootstrap-smoke uses to prove a fresh machine comes up green.
SMOKE_IMAGE=ubuntu:26.04
